name: Backend CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            shared/package-lock.json

      - name: Install dependencies
        run: |
          npm --prefix shared ci
          npm --prefix backend ci --include=optional

      - name: Validate backend and shared contracts
        run: |
          npm --prefix shared run validate
          npm --prefix backend run validate

      - name: Checkout frontend contract mirror
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devsecopslonghn/card-credit-fe
          path: frontend-contract-mirror
          persist-credentials: false

      - name: Check frontend/backend contract and catalog drift
        run: node backend/scripts/check-contract-drift.mjs frontend-contract-mirror

  build:
    needs: quality
    permissions:
      actions: read
      contents: read
      packages: write
    uses: devsecopslonghn/.github/.github/workflows/node-container.yml@fe26ac4feca06d982f9ff9e0027fb7cb65d619aa
    with:
      node_version: "22"
      working_directory: backend
      install_command: npm ci --include=optional && npm --prefix ../shared ci
      quality_command: npm --prefix ../shared run validate && npm run validate
      build_command: npm run build
      docker_context: .
      dockerfile: backend/Dockerfile
      image_name: ghcr.io/devsecopslonghn/card-credit-be
      publish_image: ${{ github.event_name != 'pull_request' }}

  update-gitops:
    needs: build
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_BRANCH: release/backend-${{ github.sha }}
      IMAGE_REPOSITORY: ghcr.io/devsecopslonghn/card-credit-be
      IMAGE_TAG: ${{ github.sha }}@${{ needs.build.outputs.digest }}
    steps:
      - name: Validate immutable release output
        run: |
          [[ "$IMAGE_TAG" =~ ^[a-f0-9]{40}@sha256:[a-f0-9]{64}$ ]]

      - name: Checkout Helm chart
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devsecopslonghn/card-credit-helm-chart
          ref: master
          token: ${{ secrets.GITOPS_TOKEN }}
          path: chart

      - name: Open immutable GitOps update
        working-directory: chart
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --repo devsecopslonghn/card-credit-helm-chart --head "$RELEASE_BRANCH" --state open --json url --jq '.[0].url // empty')
          if test -n "$existing"; then echo "Existing release PR: $existing"; exit 0; fi
          git switch -c "$RELEASE_BRANCH"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("values.yaml")
          text = path.read_text()
          match = re.search(r"(?ms)^  backend:\n.*?(?=^  [a-zA-Z]|^[a-zA-Z]|\Z)", text)
          if not match:
              raise SystemExit("backend image block was not found")
          block = match.group(0)
          block, repo_count = re.subn(r"(?m)^    repository:.*$", f"    repository: {os.environ['IMAGE_REPOSITORY']}", block, count=1)
          block, tag_count = re.subn(r"(?m)^    tag:.*$", f"    tag: {os.environ['IMAGE_TAG']}", block, count=1)
          if repo_count != 1 or tag_count != 1:
              raise SystemExit("backend image reference was not updated exactly once")
          path.write_text(text[:match.start()] + block + text[match.end():])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add values.yaml
          git diff --cached --quiet && { echo 'Chart already references this digest'; exit 0; }
          git commit -m "chore(gitops): deploy backend $GITHUB_SHA"
          git push origin "HEAD:$RELEASE_BRANCH"
          gh pr create --repo devsecopslonghn/card-credit-helm-chart --base master --head "$RELEASE_BRANCH" --title "chore(gitops): deploy backend $GITHUB_SHA" --body "Deploy the exact CI-scanned backend image: $IMAGE_TAG. Merge after chart validation and application review."
