name: Backend CI
on:
  push: {branches: [master, main]}
  pull_request:
permissions: {contents: read, packages: write}
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: ./mvnw -B verify
  image:
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: '${{ vars.GHCR_REGISTRY }}', username: '${{ github.actor }}', password: '${{ github.token }}'}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.GHCR_REGISTRY }}/${{ github.repository_owner }}/card-credit-be:${{ github.sha }}
            ${{ vars.GHCR_REGISTRY }}/${{ github.repository_owner }}/card-credit-be:latest
