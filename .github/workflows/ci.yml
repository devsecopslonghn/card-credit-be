name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    uses: devsecopslonghn/.github/.github/workflows/node-container.yml@9dce2f58f486a6bfb0a0d25c1ad901aaa342d0df
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      node_version: '22'
      working_directory: backend
      docker_context: backend
      test_script: 'npm run test:critical'
      registry: ghcr.io
      image_name: devsecopslonghn/card-credit-backend
      chart_repo: devsecopslonghn/card-credit-helm-chart
      chart_path: values.yaml
      chart_image_key: backend.image.tag
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
